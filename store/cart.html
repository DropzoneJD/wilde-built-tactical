<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart — Wilde Built Tactical</title>
  <meta name="description" content="Review your cart and proceed to secure checkout. California-legal firearms and gear from Wilde Built Tactical.">
  <link rel="stylesheet" href="assets/store.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c2a17b' stroke-width='2'><circle cx='12' cy='12' r='10'/><line x1='22' y1='12' x2='18' y2='12'/><line x1='6' y1='12' x2='2' y2='12'/><line x1='12' y1='6' x2='12' y2='2'/><line x1='12' y1='22' x2='12' y2='18'/></svg>">
  <style>
    /* Cart page layout only */
    .cart-page-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 28px;
      align-items: start;
      padding: 28px 0 54px;
    }
    .cart-summary-col {
      position: sticky;
      top: calc(var(--header-h) + 16px);
    }
    .cart-line-page {
      display: flex;
      gap: 18px;
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
      align-items: flex-start;
    }
    .cart-line-page:first-child { border-top: 1px solid var(--line); }
    .cart-line-media {
      width: 96px;
      height: 82px;
      flex: 0 0 96px;
      border-radius: var(--r-lg);
      background: radial-gradient(200px 120px at 50% 20%, rgba(194,161,123,.14), transparent 60%),
                  linear-gradient(160deg, #171c19, #11140f);
      display: grid;
      place-items: center;
      color: var(--fde);
      border: 1px solid var(--line);
      overflow: hidden;
      position: relative;
    }
    .cart-line-media::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .35;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size: 14px 14px;
    }
    .cart-line-media svg { width: 74%; height: 74%; position: relative; z-index: 1; }
    .cart-line-info { flex: 1 1 auto; min-width: 0; }
    .cart-line-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      flex: 0 0 auto;
      min-width: 90px;
    }
    .promo-row { display: flex; gap: 8px; }
    .promo-row .input { flex: 1 1 auto; }
    .discount-line { color: var(--success); }
    .ffl-notice {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      background: rgba(194,161,123,.07);
      border: 1px solid rgba(194,161,123,.3);
      border-radius: var(--r);
      padding: 12px 14px;
      margin-top: 16px;
      font-size: 13px;
    }
    .ffl-notice svg { flex: 0 0 18px; color: var(--fde); margin-top: 1px; }
    .cart-empty-page {
      text-align: center;
      padding: 80px 20px 60px;
      grid-column: 1 / -1;
    }
    .cart-empty-page .empty-icon {
      width: 80px; height: 80px;
      border-radius: 50%;
      display: grid; place-items: center;
      margin: 0 auto 20px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--faint);
    }
    .cart-empty-page .empty-icon svg { width: 36px; height: 36px; }
    @media (max-width: 840px) {
      .cart-page-grid {
        grid-template-columns: 1fr;
      }
      .cart-summary-col { position: static; }
    }
    @media (max-width: 480px) {
      .cart-line-media { width: 72px; height: 64px; flex: 0 0 72px; }
      .cart-line-right { min-width: 70px; }
    }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <div class="wrap">
    <div class="crumb">
      <a href="index.html">Home</a> / <span style="color:var(--text-soft)">Cart</span>
    </div>

    <div class="flex items-center gap-16 mb-16" style="flex-wrap:wrap">
      <h1 style="font-size:28px" id="cartPageTitle">Your Cart</h1>
      <span class="badge" id="cartPageCount">0 items</span>
    </div>

    <div class="cart-page-grid" id="cartPageGrid">
      <!-- populated by cart.js -->
    </div>

    <!-- You may also like -->
    <section class="section" style="padding-top:0" id="alsoBuy">
      <div class="section__head">
        <div>
          <div class="eyebrow">Recommended for You</div>
          <h2>You May Also Like</h2>
        </div>
      </div>
      <div class="product-grid" id="recsGrid"></div>
    </section>
  </div>

  <footer id="site-footer"></footer>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../assets/js/data.js"></script>
  <script src="assets/catalog.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/pages/cart.js"></script>
</body>
</html>
